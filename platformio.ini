; =====================================================================================
;  MIU EILIK ESP32-S3 - PlatformIO Configuration
;  Target: ESP32-S3-WROOM-1 (16MB flash, 8MB PSRAM)
;  Build environment: Arduino + FreeRTOS dual-core
; =====================================================================================

[platformio]
default_envs = eilik_s3
src_dir      = miu_eilik
; Vị trí các file .ino, .h, .csv (relative to project root)

; -------------------------------------------------------------------------------------
; Common settings shared by all environments
; -------------------------------------------------------------------------------------
[env]
platform        = espressif32 @ ~6.5.0    ; ESP32 Arduino core 2.x
framework       = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed    = 921600
; Fix C28: dùng -U thay -D cho các macro đã được ESP32 SDK define sẵn (tránh warning redefined)
build_unflags   = -std=gnu++11
build_flags     =
    -UCONFIG_ARDUINO_RUNNING_CORE
    -UCONFIG_ARDUINO_EVENT_RUNNING_CORE
    -UCONFIG_BT_ENABLED
    -UCONFIG_BT_BLE_ENABLED
    -DCORE_DEBUG_LEVEL=3                 ; WiFi/BT logs verbose
    -DCONFIG_ARDUHAL_LOG_COLORS=1        ; ANSI colors in monitor
    -DCONFIG_BT_ENABLED=0                ; Tắt Bluetooth (không dùng - tiết kiệm 100KB flash + RAM)
    -DCONFIG_BT_BLE_ENABLED=0
    -DCONFIG_FREERTOS_HZ=1000
    -DCONFIG_ARDUINO_RUNNING_CORE=0
    -DCONFIG_ARDUINO_EVENT_RUNNING_CORE=0
    -DARDUINO_USB_MODE=1                 ; Use USB CDC (Serial = USB, Serial0 = UART0)
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_flags = -std=gnu++17 -Os         ; C++17 + size optimization

; Library dependencies (resolved automatically by PlatformIO LDF)
lib_deps        =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^6.21.4
    madhephaestus/ESP32Servo@^3.0.6

; -------------------------------------------------------------------------------------
; Environment 1: ESP32-S3-WROOM-1 (16MB Flash, 8MB PSRAM)
; -------------------------------------------------------------------------------------
[env:eilik_s3]
platform    = espressif32
board       = esp32-s3-devkitc-1
; Board options:
;   - esp32-s3-devkitc-1   (N16R8: 16MB flash, 8MB PSRAM, OPI)
;   - esp32-s3-box         (alternate)
;   - um_tinys3            (tinyS3 - nếu dùng)

board_build.partitions   = partitions_16mb.csv
board_build.f_flash      = 80000000L
board_build.flash_mode   = qio
board_build.arduino.memory_type = qio_opi   ; cho OPI PSRAM (N16R8)
board_build.arduino.cdc_on_boot  = 1
board_build.arduino.usb_mode     = 1

board_build.extra_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32S3_DEV

; Library deps riêng cho env này (nếu khác common)
lib_ignore =
    ESP32 BLE Arduino          ; đã tắt BT ở trên
    BluetoothSerial

; Upload settings
upload_protocol  = esptool
upload_flags     =
    --flash_mode dio
    --flash_size 16MB
    --chip esp32s3

; -------------------------------------------------------------------------------------
; Environment 2: ESP32-S3 (8MB Flash, no PSRAM) - cho board nhỏ hơn
; -------------------------------------------------------------------------------------
[env:eilik_s3_nopsram]
platform    = espressif32
board       = esp32-s3-devkitc-1
board_build.partitions  = default_8Mb.csv
board_build.f_flash     = 80000000L
board_build.flash_mode  = qio
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
build_flags             =
    ${env.build_flags}
    -DCONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=1

; -------------------------------------------------------------------------------------
; Environment 3: ESP32-S3 Box (nếu dùng màn hình LCD Box)
; -------------------------------------------------------------------------------------
;[env:eilik_s3_box]
;platform    = espressif32
;board       = esp32-s3-box
;board_build.partitions  = default.csv
;build_flags =
;    ${env.build_flags}
;    -DARDUINO_ESP32_S3_BOX

; -------------------------------------------------------------------------------------
; Extra: GDB / Debug environment (nếu cần debug với J-Link / ESP-Prog)
; -------------------------------------------------------------------------------------
;[env:eilik_s3_debug]
;platform    = espressif32
;board       = esp32-s3-devkitc-1
;build_type  = debug
;build_flags =
;    ${env.build_flags}
;    -DCORE_DEBUG_LEVEL=5
;    -DDEBUG_ESP_PORT=Serial
;    -DDEBUG_ESP_OOM
;    -include "src/ConfigDebug.h"

; -------------------------------------------------------------------------------------
; Custom partition table - 16MB layout (A/B OTA + LittleFS)
; File: partitions_16mb.csv (project root)
;   app0      3MB   (ota_0)
;   app1      3MB   (ota_1)
;   nvs       24KB  (Preferences)
;   otadata   8KB
;   littlefs  ~9.7MB (web UI, log, future assets)
; -------------------------------------------------------------------------------------
