<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eilik Robot</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="18" stroke="#00ffd5" stroke-width="2"/>
      <circle cx="13" cy="17" r="3" fill="#00ffd5"/>
      <circle cx="27" cy="17" r="3" fill="#00ffd5"/>
      <path d="M13 25 Q20 30 27 25" stroke="#00ffd5" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
    <span class="logo-text">Eilik<span class="dot">.</span></span>
  </div>
  <div class="header-right">
    <span class="online-badge" id="conn-badge">
      <span class="led" id="led"></span>
      <span id="conn-text">offline</span>
    </span>
    <span class="fw-badge">v<span id="fw-ver">—</span></span>
  </div>
</header>

<!-- ===== LIVE STATUS (main panel) ===== -->
<main class="dashboard">

  <!-- Robot emoji display -->
  <div class="robot-status">
    <div class="robot-emoji" id="robot-face">😊</div>
    <div class="robot-label">
      <span class="status-tag" id="mood-tag">NEUTRAL</span>
    </div>
  </div>

  <!-- Stats grid -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">PAN</div>
      <div class="stat-value" id="stat-pan">—</div>
      <div class="stat-unit">°</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">TILT</div>
      <div class="stat-value" id="stat-tilt">—</div>
      <div class="stat-unit">°</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">MODE</div>
      <div class="stat-value" id="stat-mode">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">UPTIME</div>
      <div class="stat-value" id="stat-uptime">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">CLIENTS</div>
      <div class="stat-value" id="stat-clients">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">HEAP</div>
      <div class="stat-value" id="stat-heap">—</div>
      <div class="stat-unit">%</div>
    </div>
    <div class="stat-card wide">
      <div class="stat-label">IP</div>
      <div class="stat-value" id="stat-ip">—</div>
    </div>
    <div class="stat-card wide">
      <div class="stat-label">SSID</div>
      <div class="stat-value" id="stat-ssid">—</div>
    </div>
  </div>

  <!-- Moving indicator -->
  <div class="moving-bar" id="moving-bar">
    <span>● MOVING</span>
  </div>

</main>

<!-- ===== CONTROL TABS ===== -->
<nav class="tabs">
  <button class="tab-btn active" data-tab="head">HEAD</button>
  <button class="tab-btn" data-tab="emotion">MOOD</button>
  <button class="tab-btn" data-tab="gesture">GES</button>
  <button class="tab-btn" data-tab="mode">MODE</button>
  <button class="tab-btn" data-tab="calib">CALIB</button>
</nav>

<!-- ===== CONTROL SECTIONS ===== -->
<section id="tab-head" class="tab-pane active">
  <div class="dpad">
    <div></div>
    <button class="dbtn" data-pan="0" data-tilt="5">▲</button>
    <div></div>
    <button class="dbtn" data-pan="-15" data-tilt="0">◀</button>
    <button class="dbtn" id="center-btn">●</button>
    <button class="dbtn" data-pan="15" data-tilt="0">▶</button>
    <div></div>
    <button class="dbtn" data-pan="0" data-tilt="-5">▼</button>
    <div></div>
  </div>
  <div class="sliders">
    <div class="slider-row">
      <label>PAN <b id="pan-val">90</b>°</label>
      <input id="pan-slider" type="range" min="40" max="140" value="90" step="1" />
    </div>
    <div class="slider-row">
      <label>TILT <b id="tilt-val">90</b>°</label>
      <input id="tilt-slider" type="range" min="70" max="115" value="90" step="1" />
    </div>
    <button class="btn-primary" id="head-go">GO</button>
  </div>
</section>

<section id="tab-emotion" class="tab-pane">
  <div class="btn-grid">
    <button data-act="emotion" data-v="NEUTRAL">😐 NEUTRAL</button>
    <button data-act="emotion" data-v="HAPPY">😊 HAPPY</button>
    <button data-act="emotion" data-v="ANGRY">😠 ANGRY</button>
    <button data-act="emotion" data-v="SLEEPY">😴 SLEEPY</button>
    <button data-act="emotion" data-v="CURIOUS">🤔 CURIOUS</button>
    <button data-act="emotion" data-v="CONFUSED">😕 CONFUSED</button>
    <button data-act="emotion" data-v="WAKE_UP">🌅 WAKE UP</button>
  </div>
</section>

<section id="tab-gesture" class="tab-pane">
  <div class="btn-grid">
    <button data-act="gesture" data-v="YES">✅ YES</button>
    <button data-act="gesture" data-v="NO">❌ NO</button>
    <button data-act="gesture" data-v="LOOK_LEFT">◀ LOOK L</button>
    <button data-act="gesture" data-v="LOOK_RIGHT">▶ LOOK R</button>
    <button data-act="gesture" data-v="LOOK_UP">▲ LOOK UP</button>
    <button data-act="gesture" data-v="LOOK_DOWN">▼ LOOK DOWN</button>
    <button data-act="gesture" data-v="CURIOUS">🤔 CURIOUS</button>
    <button data-act="gesture" data-v="CONFUSED">😕 CONFUSED</button>
    <button data-act="gesture" data-v="SLEEP">💤 SLEEP</button>
    <button data-act="gesture" data-v="WAKE">🌅 WAKE</button>
    <button data-act="gesture" data-v="HAPPY">😊 HAPPY</button>
    <button data-act="gesture" data-v="ANGRY">😠 ANGRY</button>
    <button data-act="gesture" data-v="BREATH">🌬 BREATH</button>
  </div>
</section>

<section id="tab-mode" class="tab-pane">
  <div class="mode-cards">
    <button class="mode-card" data-act="mode" data-v="SLEEP">
      <span class="mode-icon">😴</span>
      <span class="mode-name">SLEEP</span>
      <span class="mode-desc">Imobile, low power</span>
    </button>
    <button class="mode-card" data-act="mode" data-v="CALM">
      <span class="mode-icon">😌</span>
      <span class="mode-name">CALM</span>
      <span class="mode-desc">Gentle movement</span>
    </button>
    <button class="mode-card" data-act="mode" data-v="CURIOUS">
      <span class="mode-icon">🤔</span>
      <span class="mode-name">CURIOUS</span>
      <span class="mode-desc">Explorer</span>
    </button>
    <button class="mode-card" data-act="mode" data-v="PLAYFUL">
      <span class="mode-icon">🤩</span>
      <span class="mode-name">PLAYFUL</span>
      <span class="mode-desc">Active behavior</span>
    </button>
  </div>
</section>

<section id="tab-calib" class="tab-pane">
  <div class="calib-panel">
    <p class="calib-hint">Calibration offsets — adjusts neutral center position</p>
    <div class="slider-row">
      <label>PAN offset <b id="off-pan-val">0</b>°</label>
      <input id="off-pan" type="range" min="-30" max="30" value="0" step="1" />
    </div>
    <div class="slider-row">
      <label>TILT offset <b id="off-tilt-val">0</b>°</label>
      <input id="off-tilt" type="range" min="-30" max="30" value="0" step="1" />
    </div>
    <button class="btn-primary" id="calib-save">SAVE</button>
  </div>
</section>

<!-- Toast notification -->
<div id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
